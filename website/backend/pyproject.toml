[project]
name = "market-backend"
version = "0.1.0"
description = "Unified marketplace backend for 9xBot / DimWork / openpiscis / AgentZ / theAgentOS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "orjson>=3.10",
    "jsonschema>=4.22",
    "python-multipart>=0.0.9",
    "bcrypt==4.2.1",
]

[project.optional-dependencies]
db = [
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    # aiosqlite backs the default local-dev/test DATABASE_URL (sqlite+aiosqlite)
    # so app.db works without a live Postgres instance.
    "aiosqlite==0.22.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "hypothesis==6.157.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
